<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>달력 가계부</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--ink:#17202b;--sub:#6b7686;--line:#e0e5ec;--soft:#eaeef3;
  --out:#2c6fd6;--in:#d8453a;--warn:#e8590c;--acc:#1d6b59;--acc-ink:#fff;--loan:#8a5cc7;--hol:#d8453a;--sat:#2c6fd6;
  --shadow:0 -6px 24px rgba(15,25,40,.16);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151b;--card:#18202a;--ink:#e8edf3;--sub:#93a0b1;--line:#27313d;--soft:#202a36;
    --out:#6ea2ff;--in:#ff6f64;--warn:#ff9b4d;--acc:#3ec3a0;--acc-ink:#07261d;--loan:#b896ee;--hol:#ff6f64;--sat:#6ea2ff;--shadow:0 -6px 24px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums}
.out{color:var(--out)}.in{color:var(--in)}.loan{color:var(--loan)}
.hide{display:none!important}

#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* 헤더 */
.top{display:flex;align-items:center;gap:2px;padding:6px 8px 2px}
.top .nav{width:30px;height:30px;border-radius:8px;font-size:18px;color:var(--sub)}
.top .ttl{display:flex;align-items:baseline;gap:6px;padding:2px 8px;border-radius:8px;font-weight:700;font-size:17px}
.top .ttl small{font-weight:500;font-size:11px;color:var(--sub)}
.top .sp{flex:1}
.top .ib{width:32px;height:32px;border-radius:8px;font-size:16px;color:var(--sub)}
.sum{display:flex;gap:14px;padding:0 12px 4px;font-size:12px;color:var(--sub);align-items:baseline}
.sum b{font-size:13px;color:var(--ink)}.sum .out b{color:var(--out)}.sum .in b{color:var(--in)}
.sum .rng{margin-left:auto;font-size:11px}
.bar{display:flex;align-items:center;gap:8px;padding:2px 10px 6px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{padding:3px 9px;border-radius:6px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar .sp{flex:1}
.chip-btn{padding:3px 8px;border-radius:8px;background:var(--soft);font-size:12px;color:var(--sub)}
.chip-btn.on{background:var(--acc);color:var(--acc-ink)}
.banner{display:flex;align-items:center;gap:8px;margin:0 10px 6px;padding:6px 8px 6px 10px;border-radius:10px;background:var(--soft);font-size:12px}
.banner span{flex:1}
.banner button{color:var(--sub);padding:2px 6px}
.banner .go{color:var(--acc);font-weight:700}

/* 달력 */
#cal{flex:1;overflow-y:auto;padding:0 6px 90px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.grid-h,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 42px;gap:0}
.grid-h{flex:none}
.wk{flex:1 0 62px}
.grid-h{position:sticky;top:0;background:var(--bg);z-index:2;font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.grid-h div:first-child,.grid-h div:nth-child(8){color:var(--hol)}
.grid-h div:nth-child(7){color:var(--sat)}
.wk{border-top:1px solid var(--line)}
.cell{position:relative;min-height:62px;padding:3px 2px 2px;border-right:1px solid var(--line);overflow:hidden;background:var(--card)}
.cell:nth-child(7){border-right:1px solid var(--line)}
.cell.dim{opacity:.38}
.cell.sel{outline:2px solid var(--acc);outline-offset:-2px;z-index:1}
.dn{font-size:11px;line-height:16px;height:16px;display:flex;align-items:center;gap:3px}
.dn i{font-style:normal;min-width:16px;height:16px;border-radius:8px;text-align:center;padding:0 2px}
.cell.today .dn i{background:var(--acc);color:var(--acc-ink);font-weight:700}
.cell.sun .dn i,.cell.hol .dn i{color:var(--hol)}.cell.sat .dn i{color:var(--sat)}
.cell.today .dn i{color:var(--acc-ink)}
.dn .dot{width:5px;height:5px;border-radius:50%;background:var(--loan)}
.evl{font-size:8.5px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:clip;border-radius:3px;padding:0 2px;margin-top:1px;color:#fff}
.am{font-size:10px;line-height:13px;text-align:right;white-space:nowrap;letter-spacing:-.2px}
.ws{padding:3px 4px 3px 2px;white-space:nowrap;font-size:9.5px;line-height:13px;text-align:right;background:var(--soft);display:flex;flex-direction:column;justify-content:flex-end;color:var(--sub);overflow:hidden}
.ws.hd{justify-content:flex-start}
.wk.compact{flex:0 0 30px}
.wk.compact .cell{min-height:30px}
.wk.compact .evl{display:none}
/* 주 보기: 선택한 주를 7일 목록으로 크게 */
.wk.bigw{display:block;flex:0 0 auto;background:var(--card);border-top:1px solid var(--line)}
.wr{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);min-height:46px;align-items:start}
.wr.sel{background:rgba(29,107,89,.1);box-shadow:inset 3px 0 0 var(--acc)}
.wr.dim{opacity:.42}
.wd{text-align:center;line-height:1.15}.wd b{font-size:17px;display:block}.wd small{font-size:10px;color:var(--sub)}
.wr.sun .wd b,.wr.hol .wd b{color:var(--hol)}.wr.sat .wd b{color:var(--sat)}.wr.today .wd b{color:var(--acc)}
.wm{min-width:0}
.evc{display:inline-block;font-size:10px;color:#fff;border-radius:4px;padding:0 6px;margin:0 4px 2px 0;line-height:15px}
.it2{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px}
.it2 .ic{width:20px;text-align:center;flex:none}
.it2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it2 small{color:var(--sub);font-size:10px;flex:none;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it2 b{font-weight:600;flex:none}
.wt{font-size:12px;text-align:right;line-height:1.35;font-weight:700;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wt .add-ev{font-weight:500;margin-top:2px}
.none{color:var(--sub);opacity:.5;font-size:12px}
.ics{font-size:11px;line-height:13px;margin-top:2px;white-space:nowrap;overflow:hidden;letter-spacing:-1px}
.more{font-size:9px;color:var(--sub);text-align:right}
body.sheet-open #cal{padding-bottom:calc(46dvh + 70px)}
body.sheet-full #cal{padding-bottom:90px}

/* FAB */
#fabs{position:fixed;right:14px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:30}
.fabb{width:52px;height:52px;border-radius:26px;color:#fff;font-size:30px;line-height:46px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28);position:relative;padding:0}
.fabb small{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:10px;line-height:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.fabb.out{background:var(--out)}.fabb.in{background:var(--in)}
body.sheet-open #fabs{bottom:calc(46dvh + 28px)}
body.sheet-full #fabs,body.has-modal #fabs{display:none}

/* 일 시트 */
#sheet{position:fixed;left:0;right:0;bottom:0;height:46dvh;background:var(--card);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease,height .22s ease}
body.sheet-open #sheet,body.sheet-full #sheet{transform:none}
body.sheet-full #sheet{height:calc(100dvh - 8px - env(safe-area-inset-top))}
.grab{height:16px;display:flex;align-items:center;justify-content:center;touch-action:none;flex:none}
.grab i{width:38px;height:4px;border-radius:2px;background:var(--line)}
.sh-h{display:flex;align-items:center;gap:6px;padding:0 12px 6px;flex:none}
.sh-h .d{font-weight:700;font-size:15px}
.sh-h .l{font-size:11px;color:var(--sub);margin-left:4px}
.sh-h .sp{flex:1}
.sh-h .tot{font-size:12px;text-align:right}
.sh-h .x{width:28px;height:28px;color:var(--sub);font-size:15px;border-radius:8px}
.sh-b{flex:1;overflow-y:auto;padding:0 10px 90px}
.evrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--soft);margin-bottom:6px;font-size:13px}
.evrow i{width:8px;height:8px;border-radius:4px;flex:none}
.evrow span{flex:1}.evrow small{color:var(--sub)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.trow .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.trow .m{flex:1;min-width:0}
.trow .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .m small{color:var(--sub);font-size:11px}
.trow .a{font-weight:700;font-size:14px}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:5px;background:var(--soft);color:var(--sub);margin-left:4px}
.tag.fix{background:rgba(29,107,89,.15);color:var(--acc)}
.empty{padding:26px 0;text-align:center;color:var(--sub);font-size:13px}
.add-ev{font-size:12px;color:var(--acc);padding:4px 8px;border-radius:8px;background:var(--soft)}

/* 일 보기 */
.dayv{display:flex;flex-direction:column;flex:1;min-height:0}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 4px 8px}
.strip button{padding:4px 0;border-radius:10px;background:var(--card);text-align:center;font-size:11px;color:var(--sub);border:1px solid var(--line)}
.strip button b{display:block;font-size:14px;color:var(--ink)}
.strip button.on{border-color:var(--acc);background:rgba(29,107,89,.12)}
.strip button.sun b{color:var(--hol)}.strip button.sat b{color:var(--sat)}
.strip small{display:block;font-size:9.5px;min-height:12px}
.dayv .card{background:var(--card);border-radius:14px;padding:4px 10px 10px;flex:1;overflow-y:auto}
.dayv .dh{display:flex;align-items:baseline;gap:6px;padding:8px 2px}
.dayv .dh b{font-size:16px}.dayv .dh span{font-size:11px;color:var(--sub)}.dayv .dh .sp{flex:1}

/* 모달 공통 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-height:96dvh;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.panel.full{height:100dvh;max-height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.ph b{font-size:15px}.ph .sp{flex:1}
.ph .x{width:30px;height:30px;border-radius:8px;color:var(--sub);font-size:16px}
.pb{overflow-y:auto;padding:4px 12px 12px;flex:1}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row>label{width:56px;font-size:12px;color:var(--sub);flex:none}
.fld{flex:1;min-width:0;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px 10px;outline:none}
.fld:focus{border-color:var(--acc)}
select.fld{appearance:none}
.btn{padding:9px 14px;border-radius:10px;background:var(--soft);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.dan{color:var(--warn)}
.btns{display:flex;gap:8px;align-items:center;margin-top:10px}
.btns .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:14px;background:var(--soft);font-size:12px;color:var(--sub)}
.chip.on{background:var(--acc);color:var(--acc-ink)}

/* 입력 시트 */
.amt{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:6px 12px}
.amt span{font-size:18px;color:var(--sub)}
.amt input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:26px;font-weight:700;text-align:right}
.amt.out input{color:var(--out)}.amt.in input{color:var(--in)}
.drop{display:flex;align-items:center;gap:8px;min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px 10px;font-weight:600;transition:.12s}
.drop.over{border-color:var(--acc);background:rgba(29,107,89,.12)}
.drop .ph2{color:var(--sub);font-weight:400;font-size:12px}
.drop .big{font-size:22px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.iconbar{display:flex;gap:4px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);touch-action:pan-x;scrollbar-width:none;flex:none}
.iconbar::-webkit-scrollbar{display:none}
.icb{flex:none;width:54px;padding:5px 0 4px;border-radius:12px;text-align:center;touch-action:pan-x;position:relative}
.icb .e{font-size:24px;line-height:28px;display:block}
.icb .n{font-size:10px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.icb.on{background:rgba(29,107,89,.16)}
.icb.on .n{color:var(--acc);font-weight:700}
.ghost{position:fixed;z-index:90;pointer-events:none;font-size:34px;transform:translate(-50%,-70%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column;min-width:96px}
.pop button{padding:7px 12px;text-align:left;border-radius:8px}
.pop button:active{background:var(--soft)}
.hint{font-size:11px;color:var(--sub);margin-top:4px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}

/* 합계/설정 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cards div{background:var(--soft);border-radius:12px;padding:8px 10px}
.cards small{display:block;font-size:11px;color:var(--sub)}
.cards b{font-size:15px}
.kv{display:flex;justify-content:space-between;padding:5px 2px;font-size:13px;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--sub)}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.crow .bar2{height:6px;border-radius:3px;background:var(--acc);opacity:.75}
.crow .nm{width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bw{flex:1;min-width:0}
.crow .v{width:86px;text-align:right;flex:none}
.sec{font-size:12px;color:var(--sub);margin:14px 0 4px;font-weight:700}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.list-item .e{font-size:20px;width:30px;text-align:center;display:flex;justify-content:center}
.list-item .m{flex:1;min-width:0}.list-item small{color:var(--sub);display:block}
.mini{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--sub)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#fff;transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222c38;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;z-index:99;max-width:86vw;text-align:center}

/* ---- 아이콘(라인) ---- */
.ico{--c:#7d8794;--s:34px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
.ico svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.em{font-size:calc(var(--s)*.55);line-height:1}
.icb .ico{display:flex;margin:0 auto 2px}
.icb.on .ico{box-shadow:0 0 0 2px var(--c)}
.drop .ico{--s:30px}
.trow .ic{background:none;width:auto;height:auto;border-radius:0}
.it2 .ic{width:20px;display:inline-flex}
.ics{display:flex;gap:2px;align-items:center;letter-spacing:0;font-size:10px;height:14px}
.ics .ico{background:none;border-radius:0}
.ics i{font-style:normal;color:var(--sub)}
.ghost{font-size:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.ghost .ico{--s:52px;background:var(--card)}
/* ---- 하루 기준 초과 ---- */
.lim{display:flex;justify-content:space-between;padding:2px 12px 0;font-size:11px;color:var(--sub)}
.lim b{color:var(--ink)}.lim .warn b{color:var(--warn)}
.cell.over{box-shadow:inset 0 -3px 0 var(--warn)}
.cell.over .am.out{font-weight:800}
.wr.over .wt .out{font-weight:800}.wr.over{box-shadow:inset 3px 0 0 var(--warn)}
.trow.ov,.it2.ov{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:8px}
.trow.ov .a,.it2.ov b{font-weight:800}
.overrow{background:color-mix(in srgb,var(--warn) 13%,var(--card));color:var(--warn);font-size:12px;padding:6px 10px;border-radius:8px;margin-bottom:6px}
.list-item.sub{padding-left:14px}

/* ---- PIN 잠금 ---- */
.lockscr{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(48px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
.lk-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lk-ic{width:54px;height:54px;border-radius:18px;background:color-mix(in srgb,var(--acc) 15%,var(--card));color:var(--acc);display:flex;align-items:center;justify-content:center}
.lk-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk-t{font-size:18px}.lk-s{min-height:18px;font-size:12px;color:var(--sub)}.lk-s.bad{color:var(--warn)}
.lk-dots{display:flex;gap:14px;margin-top:14px}
.lk-dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--sub);transition:.1s}
.lk-dots i.on{background:var(--acc);border-color:var(--acc)}
.lk-dots.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.lk-pad button{height:76px;border-radius:50%;background:var(--card);font-size:26px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink)}
.lk-pad button:active{background:var(--soft)}
.lk-pad button[data-k=x],.lk-pad button[data-k=del]{background:none;box-shadow:none;font-size:15px;color:var(--sub)}
.lk-forgot{font-size:12px;color:var(--sub);min-height:20px;padding:4px 10px}
.lk-sheet{position:absolute;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-end}
.lk-box{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.lk-box p{color:var(--sub);font-size:13px;margin:8px 0}

/* ---- 분류 추가 버튼 (아이콘 줄 맨 끝) ---- */

/* ---------- 날짜 유틸 (문자열 YYYY-MM-DD, UTC 기준 계산) ---------- */

const parse = s => s.split('-').map(Number);
const utc = s => { const [y, m, d] = parse(s); return Date.UTC(y, m - 1, d); };
const fromUTC = t => { const dt = new Date(t); return ymd(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); };
const addDays = (s, n) => fromUTC(utc(s) + n * 86400000);
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
const dow = s => new Date(utc(s)).getUTCDay();
const monthLast = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const normYM = (y, m) => { const t = y * 12 + (m - 1); return { y: Math.floor(t / 12), m: (t % 12 + 12) % 12 + 1 }; };
const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); };

const fmt = n => Math.round(n).toLocaleString('ko-KR');
function compact(n) {
  n = Math.round(Math.abs(n));
  if (n >= 1e8) { const v = Math.floor(n / 1e7) / 10; return (v % 1 ? v.toFixed(1) : v) + '억'; }
  if (n >= 1e4) {
    const v = n / 1e4;
    if (v >= 100) return Math.floor(v) + '만';
    if (v >= 10) return Math.floor(v) + '만';
    const f = Math.floor(v * 10) / 10;
    return (f % 1 ? f.toFixed(1) : f) + '만';
  }
  return n.toLocaleString('ko-KR');
}

let db = null;
function freshDB() {
  return { v: 1, settings: { ...DEFAULT_SETTINGS }, cats: JSON.parse(JSON.stringify(DEFAULT_CATS)), tx: [], events: [], evTypes: [], evOver: {}, rules: {}, lastBackup: null, nextId: 1 };
}
function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(DB_KEY); } catch (e) { }
  db = freshDB();
  if (raw) {
    try { adopt(JSON.parse(raw)); } catch (e) { console.warn('저장 데이터를 읽지 못했어요', e); }
  }
  return db;
}
function adopt(o) {
  if (!o || typeof o !== 'object') throw new Error('형식 오류');
  const d = freshDB();
  d.settings = { ...d.settings, ...(o.settings || {}) };
  if (Array.isArray(o.cats) && o.cats.length) {
    d.cats = o.cats;
    if (!((o.settings || {}).catsV >= 2)) {   /* 1.3.0: 보험·은행 분류 한 번만 추가 */
      const at = Math.max(0, d.cats.findIndex(c => c.id === 'loan'));
      DEFAULT_CATS.filter(c => c.id === 'ins' || c.id === 'bank').forEach((c, i) => { if (!d.cats.some(x => x.id === c.id || (x.name === c.name && x.type === c.type))) d.cats.splice(at + i, 0, { ...c, subs: [...c.subs] }); });
    }
  }
  d.settings.catsV = 2;
  if (Array.isArray(o.tx)) d.tx = o.tx.filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && isFinite(t.amount));
  if (Array.isArray(o.events)) d.events = o.events;
  if (o.evOver && typeof o.evOver === 'object') d.evOver = o.evOver;
  if (Array.isArray(o.evTypes)) d.evTypes = o.evTypes.filter(t => t && t.id && t.name);
  if (o.rules && typeof o.rules === 'object') d.rules = o.rules;
  d.lastBackup = o.lastBackup || null;
  let max = 0;
  [...d.tx, ...d.events].forEach(x => { const n = parseInt(String(x.id).replace(/\D/g, ''), 10); if (n > max) max = n; });
  d.nextId = Math.max(o.nextId || 1, max + 1);
  db = d;
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch (e) { return false; }
}

function weekOfYear(ws) {
  const sat = addDays(ws, 6), y = parse(sat)[0], jan1 = ymd(y, 1, 1), first = addDays(jan1, -dow(jan1));

}

/* ---------- 공휴일 ---------- */
const SPECIAL_HOLIDAYS = { '2026-06-03': '지방선거일', '2028-04-12': '국회의원선거일' };

    const d = addDays(ws, i), inP = d >= p.start && d <= p.end, list = txm.get(d) || [], tot = dayTotals(list), evs = evm.get(d) || [];
    const isHol = evs.some(e => e.type === 'holiday');
    const cls = ['wr', !inP && 'dim', d === ST.sel && 'sel', d === today && 'today', LIM && LIM.over.has(d) && 'over', i === 0 && 'sun', i === 6 && 'sat', isHol && 'hol'].filter(Boolean).join(' ');
    const [, dm, dd] = parse(d);
    const chips = evs.filter(e => !isMerged(e, list)).map(e => `<span class="evc" style="background:${evType(e.type).color}">${esc(e.title)}</span>`).join('');
    const items = list.map(t => {
      const c = catById(t.cat), loan = isLoan(t), k = loan ? 'loan' : t.type === 'out' ? 'out' : 'in';
      const ov = LIM && t.type === 'out' && !loan && (LIM.measure === 'all' || t.kind !== 'fix') && t.amount > LIM.limit;
      return `<div class="it2${ov ? ' ov' : ''}" data-a="tedit" data-id="${t.id}"><span class="ic">${icoHTML(c, '20px')}</span><span class="nm">${esc(t.name || (loan ? (t.type === 'in' ? '회수' : '대여') : c.name))}${comboEv(t, d) ? ' ' + evTag(comboEv(t, d)) : ''}</span><small>${esc(t.sub || (loan ? '' : c.name))}</small><b class="num ${k}">${t.type === 'out' ? '-' : '+'}${fmt(t.amount)}</b></div>`;
    }).join('');
    let tt = '';
    if (mode === 'bal') { if (inP && (d <= today || list.length)) tt = `<div class="num ${cum[d] < 0 ? 'out' : 'in'}">${cum[d] < 0 ? '-' : ''}${fmt(Math.abs(cum[d]))}</div>`; }
    else { if (tot.out) tt += `<div class="out num">-${fmt(tot.out)}</div>`; if (mode === 'both' && tot.in) tt += `<div class="in num">+${fmt(tot.in)}</div>`; }
    if (d === ST.sel) tt += `<button class="add-ev" data-a="evadd">+ 일정</button>`;
    rows += `<div class="${cls}" data-a="cell" data-d="${d}"><div class="wd"><b>${dd === 1 ? dm + '/' + dd : dd}</b><small>${DOW_KO[i]}</small></div><div class="wm">${chips}${items || (chips ? '' : '<span class="none">내역 없음</span>')}</div><div class="wt">${tt}</div></div>`;
  }
  return `<div class="wk bigw"><div class="wkh"><b>${wn}주차</b><span>${shortMD(ws)} ~ ${shortMD(addDays(ws, 6))}</span></div>${rows}</div>`;
}
function renderGrid() {
  const p = periodOf(ST.key.y, ST.key.m);
  const gs = addDays(p.start, -dow(p.start)), ge = addDays(p.end, 6 - dow(p.end));
  const txm = txByDate(gs, ge), evm = eventsByDate(gs, ge);
  const today = todayStr(), mode = S().mode, heat = S().heat, isWeek = ST.view === 'week';
  const LIM = limitInfo(p), isOver = d => !!(LIM && LIM.over.has(d));
  ensureSel();
  let maxOut = 0, run = 0; const cum = {};
  for (let d = p.start; d <= p.end; d = addDays(d, 1)) { const t = dayTotals(txm.get(d)); maxOut = Math.max(maxOut, t.out); run += t.in - t.out; cum[d] = run; }
  const selIdx = Math.max(0, Math.min(Math.floor(daysBetween(gs, ST.sel) / 7), Math.round(daysBetween(gs, ge) / 7)));
  const weeks = Math.round((daysBetween(gs, ge) + 1) / 7);
  let html = isWeek ? '' : `<div class="grid-h">${DOW_KO.map(n => `<div>${n}</div>`).join('')}<div>주합</div></div>`;
  for (let w = 0; w < weeks; w++) {
    const ws = addDays(gs, w * 7), big = isWeek && w === selIdx, compactRow = isWeek && w !== selIdx;
    if (big) { html += bigWeekHTML(ws, p, txm, evm, cum, mode, today, weekOfYear(ws)); continue; }
    let cells = '', wo = 0, wi = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), inP = d >= p.start && d <= p.end, list = txm.get(d), tot = dayTotals(list), evs = evm.get(d) || [];
      if (inP) { wo += tot.out; wi += tot.in; }
      const isHol = evs.some(e => e.type === 'holiday');
      const cls = ['cell', !inP && 'dim', d === ST.sel && 'sel', d === today && 'today', isOver(d) && 'over', i === 0 && 'sun', i === 6 && 'sat', isHol && 'hol'].filter(Boolean).join(' ');
      const [, dm, dd] = parse(d);
      const label = (dd === 1 || d === p.start) ? `${dm}/${dd}` : dd;
      let bg = '';
      if (heat && inP && maxOut > 0 && tot.out > 0) bg = ` style="background:color-mix(in srgb,var(--out) ${Math.round(8 + tot.out / maxOut * 30)}%,var(--card))"`;
      let inner = `<div class="dn"><i>${label}</i>${tot.loan ? '<span class="dot"></span>' : ''}</div>${evBars(evs, 2)}`;
      inner += amountHTML(tot, mode, cum[d], inP && (d <= today || tot.n > 0));
      if (!compactRow && list) inner += iconsRow(list);
      cells += `<div class="${cls}" data-a="cell" data-d="${d}"${bg}>${inner}</div>`;
    }
    const net = wi - wo;
    const wsum = mode === 'out' ? (wo ? `<span class="out num">-${compact(wo)}</span>` : '')
      : mode === 'both' ? (wo ? `<span class="out num">-${compact(wo)}</span>` : '') + (wi ? `<span class="in num">+${compact(wi)}</span>` : '')
        : (wo || wi ? `<span class="num ${net < 0 ? 'out' : 'in'}">${net < 0 ? '-' : ''}${compact(net)}</span>` : '');
    html += `<div class="wk ${compactRow ? 'compact' : ''}">${cells}<div class="ws${w === 0 ? ' wf' : ''}${w === weeks - 1 ? ' wl' : ''}"><em class="wn">${weekOfYear(ws)}주</em>${wsum}</div></div>`;
  }
  $('#cal').innerHTML = html;
}

/* ---------- 일 내용(시트·일 보기 공용) ---------- */
function dayTotalsText(list) {
  const t = dayTotals(list);
  let h = '';
  if (t.out) h += `<span class="out num">-${fmt(t.out)}</span> `;
  if (t.in) h += `<span class="in num">+${fmt(t.in)}</span>`;
  if (!h) h = '<span style="color:var(--sub)">내역 없음</span>';
  return h;
}
function dayBodyHTML(d) {
  const evs = eventsByDate(d, d).get(d) || [];
  const list = (txByDate(d, d).get(d) || []);
  const LIM = limitInfo(periodOf(keyOf(d).y, keyOf(d).m));
  let h = '';
  if (ST.multi) h += `<div class="mbar"><b>${ST.multi.size}개 선택</b><span class="sp"></span><button data-a="mall">전체</button><button class="dan" data-a="mdel">삭제</button><button data-a="mcancel">취소</button></div>`;
  if (LIM && LIM.over.has(d)) h += `<div class="overrow">하루 기준 ${fmt(LIM.limit)}원을 <b>${fmt(LIM.per[d] - LIM.limit)}원</b> 초과했어요</div>`;
  h += evs.filter(e => !isMerged(e, list)).map((e, i) => {
    const c = evType(e.type).color;
    const edit = e.builtin ? '' : ` data-a="evedit" data-id="${e.id}"`;
    return `<div class="evrow"${edit}><i style="background:${c}"></i><span>${esc(e.title)}</span><small>${e.builtin ? '공휴일' : evType(e.type).name}${e.cal === 'lunar' ? ' · 음력' : ''}</small></div>`;
  }).join('');
  if (!list.length) h += `<div class="empty">내역이 없어요. 아래 ＋ 버튼으로 추가해 보세요.</div>`;
  h += list.map(t => {
    const c = catById(t.cat), loan = isLoan(t);
    const lab = loan ? (t.type === 'in' ? '회수' : '대여') : c.name;
    const cls = loan ? 'loan' : t.type === 'out' ? 'out' : 'in';
    const ov = LIM && t.type === 'out' && !loan && (LIM.measure === 'all' || t.kind !== 'fix') && t.amount > LIM.limit;
    const ms = ST.multi && ST.multi.has(t.id);
    return `<div class="trow${ov ? ' ov' : ''}${ms ? ' msel' : ''}" data-a="tedit" data-id="${t.id}">${ST.multi ? `<span class="mck ${ms ? 'on' : ''}"></span>` : ''}<div class="ic">${icoHTML(c, '34px')}</div><div class="m"><b>${esc(t.name || lab)}</b><small>${lab}${t.sub ? ' · ' + esc(t.sub) : ''}${t.kind === 'fix' ? '<span class="tag fix">고정</span>' : ''}${loan ? '<span class="tag">합계 제외</span>' : ''}</small>${comboEv(t, d) ? `<div class="evline">${evTag(comboEv(t, d))}</div>` : (t.evId && db.events.find(x => x.id === t.evId) ? `<div class="evline"><span class="evt off">${linkIc}${esc(db.events.find(x => x.id === t.evId).title)} · ${shortMD(db.events.find(x => x.id === t.evId).date)}</span></div>` : '')}</div><div class="a num ${cls}">${t.type === 'out' ? '-' : '+'}${fmt(t.amount)}</div></div>`;
  }).join('');

/* ---------- 일 시트 ---------- */
function renderSheet() {
  const sh = $('#sheet'), b = document.body;
  const show = ST.view === 'month' && ST.sel && ST.sheet !== 'closed';
  b.classList.toggle('sheet-open', !!show && ST.sheet === 'half');
  b.classList.toggle('sheet-full', !!show && ST.sheet === 'full');
  if (!show) { b.style.removeProperty('--sh'); return; }
  const d = ST.sel, list = txByDate(d, d).get(d);
  sh.innerHTML = `<div class="grab" id="grab"><i></i></div>
  <div class="sh-h"><span class="d">${dLabel(d)}</span><span class="l">${lunarText(d)}</span><span class="sp"></span>
    <span class="tot">${dayTotalsText(list)}</span>
    <button class="add-ev" data-a="evadd">+ 일정</button><button class="x" data-a="sheetClose">✕</button></div>
  <div class="sh-b">${dayBodyHTML(d)}</div>`;
  bindGrab();
  /* 내역 높이만큼만 올라오게: 실제 높이를 재서 도크·달력 여백에 반영 */
  b.style.setProperty('--sh', (ST.sheet === 'half' ? sh.offsetHeight : 0) + 'px');
}
function bindGrab() {
  const g = $('#grab'); if (!g) return;
  let y0 = 0, active = false;
  g.onpointerdown = e => { y0 = e.clientY; active = true; g.setPointerCapture(e.pointerId); };
  g.onpointerup = e => {
    if (!active) return; active = false;
    const dy = e.clientY - y0;
    if (Math.abs(dy) < 8) ST.sheet = ST.sheet === 'full' ? 'half' : 'full';
    else if (dy < -30) ST.sheet = 'full';
    else if (dy > 30) ST.sheet = ST.sheet === 'full' ? 'half' : 'closed';
    renderAll(); if (ST.sheet === 'half') ensureVisible();
  };
}

/* ---------- 일 보기 ---------- */
function renderDayView() {
  const d = ST.sel, ws = addDays(d, -dow(d)), we = addDays(ws, 6);
  const txm = txByDate(ws, we), evm = eventsByDate(ws, we), today = todayStr();
  let strip = '';
  for (let i = 0; i < 7; i++) {
    const x = addDays(ws, i), t = dayTotals(txm.get(x)), isHol = (evm.get(x) || []).some(e => e.type === 'holiday');
    strip += `<button data-a="cell" data-d="${x}" class="${x === d ? 'on' : ''} ${i === 0 || isHol ? 'sun' : ''} ${i === 6 ? 'sat' : ''}">${DOW_KO[i]}<b>${parse(x)[2]}</b><small class="num ${t.out ? 'out' : ''}">${t.out ? '-' + compact(t.out) : ''}</small></button>`;
  }

  <div class="card"><div class="dh"><button class="nav" data-a="dprev">‹</button><b>${dLabel(d)}${d === today ? ' · 오늘' : ''}</b><span>${lunarText(d)}</span><span class="sp"></span><button class="nav" data-a="dnext">›</button></div>

/* ---------- 전체 ---------- */
function renderMain() {
  if (ST.view === 'day') { ensureSel(); renderDayView(); } else renderGrid();
}
function renderAll() {
  const keep = $('#cal') ? $('#cal').scrollTop : 0;
  renderTop(); renderMain(); renderSheet();
  $('#cal').scrollTop = keep;
}

/* ---------- 월 선택 ---------- */
function openPicker() {
  let y = ST.key.y;
  const m = openModal('', '');
  const draw = () => {
    $('.panel', m).innerHTML = `<div class="ph"><button class="mini" data-p="y-">‹</button><b>${y}년</b><button class="mini" data-p="y+">›</button><span class="sp"></span><button class="chip-btn" data-p="today">오늘</button><button class="x" data-p="x">✕</button></div>
    <div class="pb"><div class="cards" style="grid-template-columns:repeat(3,1fr)">${Array.from({ length: 12 }, (_, i) => {
      const p = periodOf(y, i + 1), on = ST.key.y === y && ST.key.m === i + 1;
      return `<button data-p="m${i + 1}" style="text-align:left;${on ? 'outline:2px solid var(--acc)' : ''}"><small>${shortMD(p.start)}~${shortMD(p.end)}</small><b>${i + 1}월</b></button>`;
    }).join('')}</div></div>`;
  };
  draw();
  m.onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return; const v = b.dataset.p;
    if (v === 'y-') { y--; draw(); } else if (v === 'y+') { y++; draw(); }
    else if (v === 'x') closeModal(m);
    else if (v === 'today') { ST.key = keyOf(todayStr()); ST.sel = todayStr(); closeModal(m); renderAll(); }
    else { ST.key = { y, m: +v.slice(1) }; ST.sel = null; closeModal(m); renderAll(); }
  };
}

/* ---------- 액션 ---------- */
Object.assign(ACT, {
  prev() { ST.key = shiftKey(ST.key, -1); ST.sel = null; renderAll(); },
  next() { ST.key = shiftKey(ST.key, 1); ST.sel = null; renderAll(); },
  pick() { openPicker(); },
  view(t) {
    const v = t.dataset.v; if (ST.view === v) return;
    ST.view = v;
    if (v === 'day') { ensureSel(); ST.sheet = 'closed'; }
    else if (v === 'week') { ensureSel(); ST.sheet = 'closed'; }
    renderAll(); if (v !== 'day') ensureVisible();
  },
  mode(t) { S().mode = t.dataset.v; persist(); renderAll(); },
  heat() { S().heat = !S().heat; persist(); renderAll(); },
  opts() { openOpts(); },
  hero() { S().heroMin = !S().heroMin; persist(); renderTop(); },
  today() { const t = todayStr(); ST.key = keyOf(t); selectDate(t); },
  hide() { S().hideSum = !S().hideSum; persist(); renderAll(); toast(S().hideSum ? '금액을 숨겼어요' : '금액을 보여줘요', 1000); },
  lock() { if (pinOn()) lockNow(); else { toast('먼저 PIN을 만들어요'); pinSetup(); } },
  cell(t) { selectDate(t.dataset.d); },
  goto(t) { const d = t.dataset.d; ST.key = keyOf(d); ST.sel = d; if (ST.view === 'month') ST.sheet = 'half'; renderAll(); if (ST.view !== 'day') ensureVisible(); },
  ban(t) { ST.off[t.dataset.k] = true; renderAll(); },
  sheetClose() { ST.sheet = 'closed'; ST.picked = false; renderAll(); },
  dprev() { selectDate(addDays(ST.sel, -1)); },
  dnext() { selectDate(addDays(ST.sel, 1)); },
});

/* ---------- 스와이프 (월 이동 / 일 이동) ---------- */
(function swipe() {
  let x0 = 0, y0 = 0, on = false;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; on = !!e.target.closest('#cal') && !e.target.closest('.modal'); x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .6) return;
    if (ST.view === 'day') (dx < 0 ? ACT.dnext : ACT.dprev)(); else (dx < 0 ? ACT.next : ACT.prev)();
  }, { passive: true });
})();
/* ===== 달력 가계부 · 입력 시트(내역) + 이벤트 시트 ===== */
function defaultInputDate() {
  return (ST.sel && (ST.picked || ST.sheet !== 'closed' || ST.view !== 'month')) ? ST.sel : todayStr();
}
function revealDate(d) {
  const p = periodOf(ST.key.y, ST.key.m);
  if (ST.view !== 'day' && (d < p.start || d > p.end)) ST.key = keyOf(d);
  if (ST.view === 'day') ST.key = keyOf(d);
  ST.sel = d;
  if (ST.view === 'month' && ST.sheet === 'closed') ST.sheet = 'half';
}

  /* 아이콘 줄: 탭=선택, 위로 끌기=드래그 등록, 길게 누르기=세부 항목 */

      const cont = !edit && q('#iCont').checked;

/* ---------- 아이콘 줄 제스처 ---------- */
function bindIconBar(bar, drop, setCat, getSt) {
  bar.addEventListener('pointerdown', e => {
    const b = e.target.closest('.icb'); if (!b || b.classList.contains('add')) return;
    const id = b.dataset.c, sx = e.clientX, sy = e.clientY, icon = $('.ico', b).outerHTML;
    let dragging = false, long = false, ghost = null, moved = false, over = false;
    const timer = setTimeout(() => { if (!moved) { long = true; showSubPop(b, id, setCat, getSt); } }, 450);
    const dropHit = (x, y) => {
      const r = drop.getBoundingClientRect(), br = bar.getBoundingClientRect();
      return (x > r.left - 20 && x < r.right + 20 && y > r.top - 30 && y < r.bottom + 30) || y < br.top - 40;
    };
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (Math.hypot(dx, dy) > 8) moved = true;
      if (!dragging && !long && dy < -14 && Math.abs(dy) > Math.abs(dx)) {
        dragging = true; clearTimeout(timer);
        ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = icon; document.body.appendChild(ghost);
      }
      if (moved && !dragging) clearTimeout(timer);
      if (dragging) {
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        over = dropHit(ev.clientX, ev.clientY); drop.classList.toggle('over', over);
      }
    };
    const end = (ev, cancelled) => {
      clearTimeout(timer);
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', cn);
      drop.classList.remove('over');
      if (ghost) ghost.remove();
      if (cancelled) return;
      if (dragging) { if (over) setCat(id); }
      else if (!long && !moved) setCat(id);
    };
    const up = ev => end(ev, false), cn = ev => end(ev, true);
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', cn);
  });
}
function showSubPop(btn, id, setCat, getSt) {
  $$('.pop').forEach(p => p.remove());
  const c = catById(id), r = btn.getBoundingClientRect();
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 150)) + 'px';
  pop.style.bottom = (window.innerHeight - r.top + 6) + 'px';
  const items = [{ s: '', label: c.subs.length ? '세부 없음' : '이 분류로 선택' }, ...c.subs.map(s => ({ s, label: s }))];
  pop.innerHTML = items.map((x, i) => `<button data-i="${i}">${esc(x.label)}</button>`).join('') + `<button data-i="x" style="color:var(--sub)">닫기</button>`;
  document.body.appendChild(pop);
  pop.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.i !== 'x') { setCat(id); getSt().sub = items[+b.dataset.i].s; setCat(id); }
    pop.remove();
  };
}

    if (tp.mode === 'prev') { const k = shiftKey(ST.key, -1), p = periodOf(k.y, k.m); return [p.start, p.end]; }
    if (tp.mode === '30') return [addDays(t, -29), t];

    <div class="kv"><span>가장 많이 쓴 날</span><span class="num">${max ? shortMD(max.d) + ' · ' + fmt(max.v) : '-'}</span></div>

/* ===== 달력 가계부 · PIN 잠금 (6자리, 엔터 없이 마지막 자리에서 바로 확인) ===== */
const PINKEY = 'gagyebu.pin.v1', PIN_LEN = 6;
const pinCfg = () => { try { return JSON.parse(localStorage.getItem(PINKEY) || 'null'); } catch (e) { return null; } };
const pinSave = c => { try { if (c) localStorage.setItem(PINKEY, JSON.stringify(c)); else localStorage.removeItem(PINKEY); } catch (e) { } };
async function pinHash(pin, salt) {
  const s = salt + ':' + pin;
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return 'f' + (h >>> 0).toString(16);
}
const pinDots = n => Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');

/* 숫자 키패드 화면. onFull(pin, api)은 6자리가 채워지는 즉시 호출된다. */
function pinPad({ title, sub = '', cancel = false, forgot = false, onFull }) {
  const el = document.createElement('div'); el.className = 'lockscr';
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, cancel ? 'x' : '', 0, 'del'];
  el.innerHTML = `<div class="lk-top"><div class="lk-ic"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg></div>
    <b class="lk-t"></b><div class="lk-s"></div><div class="lk-dots"></div></div>
    <div class="lk-pad">${keys.map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k === 'del' ? '⌫' : k === 'x' ? '취소' : k}</button>`).join('')}</div>
    ${forgot ? '<button class="lk-forgot" data-k="forgot">PIN을 잊었어요</button>' : '<span class="lk-forgot"></span>'}`;
  document.body.appendChild(el);
  let v = '', busy = false;
  const $t = $('.lk-t', el), $s = $('.lk-s', el), $d = $('.lk-dots', el);
  const paint = () => { $d.innerHTML = pinDots(v.length); };
  const api = {
    el, close() { el.remove(); },
    set(t, s) { $t.textContent = t; $s.textContent = s || ''; $s.classList.remove('bad'); },
    bad(msg) { $s.textContent = msg; $s.classList.add('bad'); $d.classList.remove('shake'); void $d.offsetWidth; $d.classList.add('shake'); if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) { } },
    onForgot: null, onCancel: null
  };
  api.set(title, sub); paint();
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-k]'); if (!b || busy) return;
    const k = b.dataset.k;
    if (k === 'x') { api.close(); if (api.onCancel) api.onCancel(); return; }
    if (k === 'forgot') { if (api.onForgot) api.onForgot(); return; }
    if (k === 'del') v = v.slice(0, -1);
    else if (v.length < PIN_LEN) v += k;

      busy = true; const pin = v;
      try { await onFull(pin, api); } finally { v = ''; busy = false; if (el.isConnected) paint(); }
    }

}

      const b = ev.target.closest('[data-f]'); if (!b) return;
      if (b.dataset.f === 'no') { f.remove(); return; }
      if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = '정말 지움? 한 번 더'; return; }
      try { localStorage.removeItem(PINKEY); localStorage.removeItem('gagyebu.db.v1'); } catch (e) { }
      location.reload();
    });
  };
}

/* ---------- 설정에서 쓰는 동작 ---------- */
function pinSetup(done) {
  let first = null;
  const api = pinPad({
    title: '새 PIN 6자리', sub: '숫자 6개를 누르면 돼요', cancel: true,
    onFull: async (pin, a) => {
      if (first === null) { first = pin; a.set('한 번 더 입력', '확인을 위해 같은 PIN을 다시 눌러 주세요'); return; }
      if (pin !== first) { first = null; a.set('새 PIN 6자리', ''); a.bad('두 번이 달라요. 처음부터 다시 눌러 주세요'); return; }
      const old = pinCfg(), salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      pinSave({ salt, hash: await pinHash(pin, salt), after: old ? old.after : 60, fails: 0, until: 0 });
      a.close(); toast('PIN을 설정했어요'); if (done) done();
    }
  });
  api.onCancel = () => { if (done) done(); };
}
function pinVerify(title, ok) {
  const api = pinPad({
    title, sub: '현재 PIN을 눌러 주세요', cancel: true,
    onFull: async (pin, a) => {
      const c = pinCfg(); if (!c) { a.close(); ok(); return; }
      if (await pinHash(pin, c.salt) === c.hash) { a.close(); ok(); } else a.bad('PIN이 달라요');
    }
  });
  api.onCancel = () => { };
}
const pinOn = () => !!pinCfg();
function pinToggle() { if (pinOn()) pinVerify('PIN 끄기', () => { pinSave(null); toast('PIN 잠금을 껐어요'); renderSettings(); }); else pinSetup(() => renderSettings()); }
function pinChange() { pinVerify('PIN 변경', () => pinSetup(() => renderSettings())); }
function pinAfter(sec) { const c = pinCfg(); if (!c) return; c.after = +sec; pinSave(c); renderSettings(); }

/* 앱을 나갔다가 돌아올 때 다시 잠금 */
(function () {
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    const c = pinCfg(); if (!c) return;
    if (document.visibilityState === 'hidden') hiddenAt = Date.now();
    else if (hiddenAt && (Date.now() - hiddenAt) / 1000 >= (c.after || 0)) { hiddenAt = 0; lockNow(); }
  });
})();
/* ===== 달력 가계부 · 시작 ===== */
(function boot() {
  loadDB();
  ST.key = keyOf(todayStr());
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-a]');
    if (!t) return;
    const f = ACT[t.dataset.a];
    if (f) f(t, e);
  });
  bindRestore();
  lockNow();
  renderAll();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  /* 자정이 지나 앱이 다시 보일 때 오늘 날짜 갱신 */
  let last = todayStr();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && todayStr() !== last) { last = todayStr(); renderAll(); }
  });
})();

</script>
