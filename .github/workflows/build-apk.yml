      - name: APK 빌드
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK 이름 정리
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk gagyebu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-apk
          path: gagyebu.apk

      - name: 릴리스로 올리기 (폰에서 바로 내려받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 가계부 APK v${{ env.APPVER }} (빌드 ${{ github.run_number }})
          files: gagyebu.apk
          body: |
            달력 가계부 안드로이드 앱 v${{ env.APPVER }}
            폰에서 gagyebu.apk 를 내려받아 설치하세요. (이전 버전 위에 그대로 덮어 설치돼요)
