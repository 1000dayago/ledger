      - name: APK 빌드
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK 이름 정리
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk gagyebu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-apk
          path: gagyebu.apk

      - name: 릴리스로 올리기 (폰에서 바로 내려받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 가계부 APK v${{ env.APPVER }} (빌드 ${{ github.run_number }})
          files: gagyebu.apk
          body: |
